# BMAD ↔ 治理基线 ↔ OpenSpec 三方映射
# 用户可选择从任一入口开始工作
# 上游版本：BMAD v6.10.0（见 UPSTREAM-VERSIONS.yaml）

# === 权威优先级 ===
# 治理约束 > 代理规则 > 技能默认行为
# 冲突时以治理层文档为准（详见 CLAUDE.md 权威优先级规则）

# === 输出语言约束（强制，MUST）===
# 通过本桥接进入 BMAD 或 agents/ 多代理元系统的任何工作流：
#   1. 模型的对话沟通、过程叙述、提问一律使用中文（简体）；
#   2. 产出文档（PRD / 架构 / Story / 研究报告 / 评审结论等）正文一律使用中文（简体）；
#      代码、命令、路径、API 标识符、专有名词可保留英文原文；
#   3. BMAD 侧配置同源：_bmad/core/config.yaml 与 _bmad/bmm/config.yaml 的
#      communication_language / document_output_language 已设为 中文（简体），
#      持久 pin 在 _bmad/custom/config.toml（安装器升级不会覆盖）——三处必须保持一致；
#   4. agents/ 侧入口约束见 agents/README.md「输出语言约束」节；
#   5. 上游（BMAD / agency-agents）原文为英文不构成豁免；技能/代理正文与本约束冲突时，
#      按权威优先级以本桥接与治理文档为准。
output_language:
  communication: 中文（简体）
  documents: 中文（简体）
  exceptions: [代码, 命令, 路径, API 标识符, 引用的英文原文]

phase_mapping:
  analysis:        # BMAD 第一阶段：需求分析与产品构思
    description: 理解问题域、用户需求和市场定位
    bmad_skills:
      - bmad-brainstorming          # 头脑风暴
      - bmad-forge-idea             # 想法压力测试（v6.10+）
      - bmad-market-research        # 市场调研
      - bmad-domain-research        # 领域研究
      - bmad-product-brief          # 产品简报
    bmad_agents: ["PM (产品经理)"]
    governance_agents:
      - agents/meta/product-manager.md      # 需求分析、优先级、PRD
    governance_docs:
      - 01-charter.md               # 平台宪章，确认项目定位
      - profiles/                    # 选择匹配的项目 profile
    openspec_action: explore         # 或 /opsx:propose（OpenSpec 1.3+ 一步提案）

  planning:        # BMAD 第二阶段：需求细化与规划
    description: 将产品构思转化为可执行的需求规格
    bmad_skills:
      - bmad-prd                    # 创建/更新/验证 PRD（v6.7+ 统一入口）
      - bmad-spec                   # SPEC kernel 蒸馏（v6.10+）
      - bmad-prfaq                  # Working Backwards PRFAQ（可选）
      - bmad-create-prd             # 已弃用，v7 移除；请用 bmad-prd
      - bmad-validate-prd           # 已弃用；请用 bmad-prd validate
      - bmad-edit-prd               # 已弃用；请用 bmad-prd update
      - bmad-sprint-planning        # 冲刺规划
    bmad_agents: ["PM (产品经理)", "SM (Scrum Master)"]
    governance_agents:
      - agents/meta/product-manager.md      # 需求分析
      - agents/meta/sprint-prioritizer.md   # 冲刺规划、任务排序
    governance_docs:
      - 02-phase-governance.md       # 阶段治理约束
      - foundations/                  # 适用的方法论约束
    openspec_action: propose         # OpenSpec 1.3+ 默认；legacy 用 new-change → continue

  solutioning:     # BMAD 第三阶段：架构与技术方案
    description: 设计系统架构、技术选型和实现方案
    bmad_skills:
      - bmad-architecture           # 架构（v6.10 统一入口）
      - bmad-create-architecture    # 已弃用，v7 移除；请用 bmad-architecture
      - bmad-ux                     # UX 设计（v6.10，替代 bmad-create-ux-design）
      - bmad-create-epics-and-stories  # 创建史诗和故事
      - bmad-technical-research     # 技术调研
    bmad_agents: ["Architect (架构师)", "UX Designer (UX 设计师)"]
    governance_agents:
      - agents/core/software-architect.md   # 架构决策、ADR、C4 模型
      - agents/design/design-system-architect.md  # 设计系统、UX 架构
    governance_docs:
      - domains/                     # 适用的领域约束
      - templates/adr-template.md    # 架构决策记录
      - templates/summary-design-template.md
    openspec_action: continue → specs, design

  implementation:  # BMAD 第四阶段：编码实现与质量保障
    description: 实现代码、编写测试、代码审查
    canonical_path: |
      实现阶段的推荐路径：
      1. openspec-apply（主要）— 从 tasks.md 取任务，逐个实现
      2. agents/core/senior-developer.md — 通用实现角色
      3. agents/core/code-reviewer.md — 代码审查
      4. agents/core/qa-verifier.md (standard) — 常规 QA
      5. agents/core/qa-verifier.md (strict) — 里程碑预发布检查

      BMAD 的 bmad-dev-story 和 bmad-quick-dev 可作为补充，
      特别是需要 TDD 纪律或故事级别工作时。
      但最终实现产出物必须通过 openspec-apply 归档。
    bmad_skills:
      - bmad-dev-story              # 开发故事
      - bmad-quick-dev              # 快速开发
      - bmad-dev-auto               # 无人值守开发循环单次迭代（v6.10+）
      - bmad-checkpoint-preview     # 变更人工检查点（v6.7+）
      - bmad-code-review            # 代码审查
      - bmad-qa-generate-e2e-tests  # 生成 E2E 测试
      - bmad-check-implementation-readiness  # 检查实现就绪
    bmad_agents: ["Dev (开发者)", "QA (质量工程师)"]
    governance_agents:
      - agents/core/senior-developer.md     # 通用实现
      - agents/core/code-reviewer.md        # 代码审查
      - agents/core/qa-verifier.md          # 质量验证（standard/strict）
    governance_docs:
      - 04-verification-policy.md    # 验证政策
      - domains/coding-standards.md  # 编码标准
      - domains/automation.md        # 自动化与回归
    openspec_action: apply

# === BMAD 代理 → 治理代理映射 ===
# BMAD 自带虚拟代理角色（John PM, Winston Architect 等），
# 本框架有对应的实际代理文件。对照表：

agent_mapping:
  bmad_pm:
    bmad_name: "John (PM)"
    governance_file: agents/meta/product-manager.md
    note: BMAD PM 偏产品策略，governance PM 偏需求分析

  bmad_scrum_master:
    bmad_name: "Bob (SM)"
    governance_file: agents/meta/sprint-prioritizer.md
    note: BMAD SM 偏仪式管理，governance 版偏数据驱动排序

  bmad_architect:
    bmad_name: "Winston (Architect)"
    governance_file: agents/core/software-architect.md
    note: 能力高度重叠，governance 版有治理绑定

  bmad_ux_designer:
    bmad_name: "Sarah (UX Designer)"
    governance_file: agents/design/design-system-architect.md
    note: governance 版合并了 UX 架构 + UI 设计

  bmad_developer:
    bmad_name: "Amelia (Dev)"
    governance_file: agents/core/senior-developer.md
    note: governance 版技术栈无关，无 Laravel 硬编码

  bmad_qa:
    bmad_name: "Quinn (QA)"
    governance_file: agents/core/qa-verifier.md
    note: governance 版合并了证据采集 + 现实检查，支持 standard/strict 模式

workflow_selection_guide: |
  ## 工作流选择建议

  ### 按任务规模选择
  - **快速修复/小变更**：直接 OpenSpec → /opsx:ff → /opsx:apply
  - **单个功能开发**：OpenSpec → /opsx:new → /opsx:continue → /opsx:apply
  - **全新产品/MVP**：BMAD 全流程（brainstorm → PRD → architecture → stories → dev）+ OpenSpec 归档
  - **大型重构**：OpenSpec explore → BMAD architecture → OpenSpec apply

  ### 按入口选择
  - **我有想法但不确定**：/opsx:explore 或 bmad-brainstorming
  - **我知道要什么但需要规划**：bmad-create-prd 或 /opsx:new
  - **我知道要什么也知道怎么做**：/opsx:ff 直接快进
  - **已有代码需要审查**：bmad-code-review 或 agents/core/code-reviewer.md

  ### 工具互补关系
  - BMAD 擅长：产品思维（PRD、用户故事）、团队协作模拟、冲刺管理
  - OpenSpec 擅长：变更追踪、规范驱动、增量规范合并、归档审计
  - Superpowers 擅长：TDD 纪律、调试方法论、代码质量模式
  - 治理基线擅长：约束边界、验证政策、分层方法论

  ### 实现阶段选择
  - **默认用 openspec-apply** — 变更可追踪，产出物归档
  - **补充用 bmad-dev-story** — 需要故事级 TDD 纪律时
  - **审查用 agents/core/code-reviewer** — 比 bmad-code-review 更深入
  - **验证用 agents/core/qa-verifier** — standard(常规) 或 strict(预发布)
