# 治理能力地图 —— 双向绑定的唯一权威
#
# 本文件是"用治理控制治理迭代"的执行点：治理能力面的任何增删改，
# MUST 先改本文件，再改实现。校验：python scripts/check_capability_map.py
#
# 双向含义：
#   正向（规划→落地） capability → fr → story → change → revision → rules → checks
#   反向（代码→意图） 任意 check/rule/story 都能回溯到 fr 与目标成熟度
#
# 成熟度口径（不可自评升级，缺证据自动降级）：
#   M0 仅声明      有文档或规则，无可执行校验
#   M1 可执行      有脚本/门禁能跑，但未证明能抓错
#   M2 已证伪能力  破坏性测试证明能抓到真实缺陷（有具体案例）
#   M3 有对照效应量 配对实验给出量化差异，且方向一致数已报；
#                  或（仅约束型能力）attempts≥8 的绕过尝试全部被拒且审计可查——
#                  见 evidence.kind=bypass_attempt，必须带 attempts / rejected 计数
#   M4 跨任务复现  ≥2 个独立任务同向，且至少 1 个 A 级样本
#                  注意：bypass_attempt 不替代跨任务复现，M4 仍只认 effect_size

