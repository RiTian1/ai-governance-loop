        note: |
          15 条按攻击面枚举的绕过尝试，全部被拒且无副作用（gov.S05.06）：
          审计侧 A1-A4（让 local/ 不可写后取/写凭据）、密文侧 B1-B3
          （篡改/换名/截断）、密钥侧 B4（改 salt）、口令侧 C1-C2、
          记账侧 D1-D2（缺 purpose / 空白 purpose）、破坏侧 E1-E2
          （rm 无 --yes / 空内容覆盖）、输入侧 F1。
          三平台：Windows 3.13 = 15/15、macOS 3.9.6 = 15/15、
          Linux root 3.10 = 13/13（A3/A4 在 root 下不适用——root 不受
          文件权限约束，该攻击面不存在，标为不适用而非算作通过）。
          不计入统计的三类见脚本 NOT_DEFENDED：
          持 passphrase 者 / 内存取证 / 伪造 purpose 后正常取用。
      - kind: destructive_test
        ref: docs/governance/VAULT.md
        note: |
          15 组边界自测：缺 purpose 拒绝(exit 2)、错误口令(exit 4)、vault.bin
          单字节篡改(exit 4)、rm 无 --yes 拒绝、审计无需口令可读、
          CRLF PEM 往返字节一致（第一版此处为真 bug，读数时换行归一化损坏 PEM）
      - kind: destructive_test
        ref: scripts/gov_vault_selftest.py
        note: |
          跨平台自测 66 项，三平台各跑一遍全绿：
          Windows 11 / Python 3.13.14、Linux 6.8 / Python 3.10.12、
          macOS 14.8.8 (Intel) / Python 3.9.6（系统自带版本，正是会被
          3.10+ API 打崩的环境）。
          覆盖：密文换名解密失败(exit 4)、审计不可写时 get 拒绝(exit 5)、
          8 路并发 put 无丢条目、二进制 .p12 往返 sha256 一致、
          v1 单文件库迁移、Unix 0700/0600 与 Windows ACL 实测。
          跨平台互操作四向全过（Linux↔Windows、macOS↔Windows），
          中文条目名 / ümlaut / 二进制 / PEM 122 字节零差异。
      - kind: defect_found
        ref: scripts/gov_vault.py
        note: |
          绕过测试第一轮 13/15，抓到两处"约束在异常路径没贯彻到底"：
          A2 — put 在审计不可写时返回 exit 1（FileLock 的 mkdir 失败裸抛
          OSError），而 get 正确返回 5，同一约束在两个命令上行为不一致；
          A4 — 审计写不进去时凭据已被改（save_entry → audit 的顺序导致），
          形成"改了但日志查不到"。均已修：mkdir/PermissionError 转
          VaultError(5)，put/rm 在审计失败时回滚。
      - kind: defect_found
        ref: <本机运维脚本>
        note: |
          该脚本曾硬编码明文 SSH 口令，是本次建箱的直接触发点。
          第二轮移植性改造又暴露四个换平台必崩的问题：Path.write_text(newline=)
          是 3.10+（macOS 自带 3.9 直接 TypeError）、目录未 chmod 700 导致
          audit.log 明文可读、无写锁导致并发 put 丢更新、read_bytes().decode()
          让 .p12 直接崩。Windows 侧另有一个：icacls /T 递归把 (OI)(CI) 套到
          文件上会产出空 DACL（锁文件变成谁都打不开的裸文件）。
    story: gov.S04.29
    change: null
    revision: rev-2026-11-20-credential-vault
    next: 绕过集未覆盖"多端口令不一致"与"git 二进制冲突"（那是运维场景不是攻击面）；若将来接入网络分发需补传输侧；macOS 离线 wheel 安装流程仍待脚本化（系统 pip 21.2.4 拿不到 wheel、需一并装 cffi）

