        note: |
          18 条真实世界的明文形态全部被抓，10 条易误报形态全部放行（gov.S05.07）。
          必抓：shell 赋值 / 大写变量 / passwd 变体 / api_key / 驼峰 apiKey /
          JSON `"password": "..."` / YAML / 注释掉的旧密码 / AWS key /
          GitHub PAT / GitLab PAT / Bearer / 连接串内嵌口令 / RSA 与 OpenSSH 私钥头。
          必放：<REDACTED> / "string" / "changeme" / config.db_password /
          $DB_PASSWORD / md5(password)= 哈希描述 / ****** / 类型注解 / {{ }} 模板。
          三平台一致：Windows 3.13、Linux 3.10、macOS 3.9.6 均 18/18 + 10/10。
      - kind: defect_found
        ref: scripts/check_staged_content.py
        note: |
          对抗集 H08 抓获：`  "password": "hunter2xyz-example",` ——带引号的 JSON key
          完全绕过。正则的 [A-Za-z0-9_.-]* 匹配不到 `"`，导致 password 后面的
          `":` 让整个模式失败。而 JSON 配置是最常见的凭证载体之一。
          修 key 两侧允许 ['"]? 后，又暴露出新误报 `{"password": PWD}` （常量引用），
          补"全大写标识符"放行规则时必须写 (?-i:...)，否则外层 (?ix) 会放行任何
          标识符包括真口令。修完全量回归命中数与放宽前一致（4 条，均在 gitignore 内）。
      - kind: defect_found
        ref: docs/experiments/rsi-delivery-benchmark/runs/2026-11-20-j3b-4rounds
        note: 拦截 3 次，其中 2 次是 MD5( 哈希描述被误判；假阳性率 2/3
    story: gov.S05.07
    change: null
