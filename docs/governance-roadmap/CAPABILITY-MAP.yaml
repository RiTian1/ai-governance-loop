        note: |
          判分脚本第一版把命中率分子取反（配对表中 base 用了 a+b，那其实是
          gov 的），算出 base=1.00 → 触发天花板规则 → 得出「本轮测不出东西」
          的完全错误结论。真实结果是 base=0.619 / gov=1.000 / p=0.0078。
          判据算错会直接翻转结论，已加 --selftest 12 项（6 组 McNemar 已知值
          + 6 项配对表语义）固化为可回归检查。
      - kind: destructive_test
        ref: scripts/opencode_preflight.py
        note: |
          双向验证：挂掉的 <推理端点>（<模型>，100% 502、0.04s 返回）
          → exit 1 并归因「上游不可用」；活着的 <推理端点>（<模型>）
          → exit 0，2/2 返回 "OK"。没有这组对照，工具的判别力只是声明。
          该工具的直接动因是一次真实误判：/v1/models 返回 401 被读成
          「服务在线，是客户端不写文件」，而实际推理端点 100% 502，
          导致 6 个实验臂 × 2 轮 = 12 次尝试全部空转。
      - kind: destructive_test
        ref: docs/experiments/rsi-delivery-benchmark/runs/2026-11-20-j3b-<配对实验>/summary.md
        note: |
          J3b §8.6 配对实验判分（n=21）：主口径 p=0.0078 显著、
          敏感性口径 p=0.1250 不显著，两口径 base_only 均为 0。
          报告并列披露双口径、标注 n 未达预注册、列出四条局限。
          这一条是「口径敏感性必须并列报告」的实例载体。
    story: gov.S05.09
    change: null
    revision: rev-2026-11-25-<配对实验>-verdict
