trigger_summary: |
  下游项目 dogfood 暴露：治理"规则文本"与"检查脚本"齐全，但二者断链——存在规则、存在 checker，
  却没有任何自动强制点，且脚本 fail-open（缺 pyyaml 时 exit 2，被 agent 当环境问题跳过）。
  本 revision 把闭环治理改成 git-optional 的强制执行：脚本零依赖 + fail-closed；入口契约（AGENTS/CLAUDE/
  政策文档/导出规则）改成 CRUD=同步事件的不可跳过 STOP 门；新增同步台账兜底；git 门禁降级为可选附加层。
