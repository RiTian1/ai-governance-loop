trigger_summary: |
  用户审计提问：治理集成到 Codex/Cursor/Claude 项目后，测试域（凭证、地址）与开发域
  （接口约定）等分类分场景事实能否自动持久化，避免 agent 偏离与重复询问；同时约束
  200k 上下文窗口下治理常驻 token 消耗必须最小化。
  缺口审计结论：事实清单（runtime-context.yaml）有格式无闭环——
  ① AGENTS 模板启动顺序不含事实清单（入口断链）；
  ② 用户口头提供的事实无回写闸（fail-open）；
  ③ --check-runtime-context 文档承诺未实现、preflight 不查 secrets/perms（doc/tool 漂移）；
  ④ 开发域事实无标准位（project-rules.md 无模板）。
  实施：AGENTS 模板加 ≤10 行"问前先查/答后落账"路标；runtime-context 域补 r8/r9/r10；
  check_knowledge_health 落地 --check-runtime-context；preflight 补 secrets/perms 校验；
  governance-continue 检查点加事实落账核对；§7 扩事实域行 + project-rules 模板。
  token 策略：常驻面只加路标行，事实内容全部触发式装载（loader keywords / 按需读文件），
  单文件体量硬上限（runtime-context ≤ 20 KB、project-rules ≤ 300 行）。
