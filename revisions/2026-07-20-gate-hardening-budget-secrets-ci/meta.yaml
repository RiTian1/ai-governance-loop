trigger_summary: |
  用户追问"脚本门控是否还需要补充工具能力"，按实证缺口审计出四项（其一为纪律变硬）：
  ① 常驻面 token 预算无闸——200k 窗口约束下 AGENTS/CLAUDE/.cursor rules 膨胀是慢性漂移，
     context_loader 只管按需装载不管常驻面；
  ② 事实落账机制（r9）让凭证流向文件，但"禁明文"无确定性拦截；GBK 乱码本机反复复现
     而"非 UTF-8 禁写"同样无闸；
  ③ git hook 可被 --no-verify 绕过，无随治理分发的 CI 门禁镜像；
  实施：check_context_budget.py（CJK 感知估算 + resident_token_budget manifest 键）+
  check_staged_content.py（凭证正则 + UTF-8 合法性，--staged/--all 双模式 + gov:allow-secret
  行内豁免）+ pre-commit/统一入口接入 + templates/ci/ 双平台模板 + tool.r8/r9/r10。
