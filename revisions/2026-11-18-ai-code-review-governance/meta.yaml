trigger_summary: |
  AI 参与编码后，产能、上下文、责任三个不对称同时出现：人读不完 diff、
  diff 里没有"为什么"、出事时责任无人承担。既有 04-verification-policy 只回答
  "跑没跑过"，不回答"谁看了、看懂到什么程度、谁担责"。本 revision 新增 review 域，
  把评审从"证明它对"改为"明确谁接受它可能不对"，并提供可机检的模板与门禁。

verification:
