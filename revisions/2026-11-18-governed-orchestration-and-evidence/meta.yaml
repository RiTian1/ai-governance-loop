trigger_summary: |
  evolver 与 AutoResearch 用相反的方法解同一问题（统计 vs 证据），却收敛到同一条铁律：
  "没发生"与"正常"在数据结构上长得一样时，系统会把失败统计成成功。
  本 revision 新增编排域，把证据闭环、晋升淘汰、声明式路由收敛成 8 条规则。
