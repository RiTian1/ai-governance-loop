trigger_summary: |
  RSI 五任务实验发现四条与任务类型无关的结构性缺陷：(1) 条款压制不确定表达
  （T02 t=-2.06）；(2) 数字条款导致规避（T03 t=-2.32、M01 t=-2.21）；
  (3) 引用要求不区分源类型，在 csv/网页上反噬（T02 -17.6%、T04 -42.2%）；
  (4) 无成本上限，M01 input +80%、步数 +38% 但质量无改善。
  这四条不需新实验即可修，写入 05-ai-collaboration-policy.md §8。
