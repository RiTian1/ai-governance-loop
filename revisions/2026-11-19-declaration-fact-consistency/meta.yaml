benchmark:
  mode: regression
  test: 造漂移 → 必须报错（两次实验）
  before: |
    加 benchmarked 状态时，改完 revisions/WORKFLOW.md 后仍有 3 处写着旧状态机
    （domains/tooling/revisions/_summary.yaml 的 r5 文本、
     domains/tooling/revisions/index.md 的状态表、
     foundations/progress-traceability-and-binding.md 的模板注释与三端表），
    全靠人工 grep 才找齐。
  after: |
    脚本自动检出。验证：
    (1) 把 WORKFLOW.md 状态链改回旧版 → 报 2 个 error
        （"实际状态 [archived, benchmarked] 未出现在正典" +
          "副本出现正典中没有的状态"）
    (2) 全仓正常态 → errors=0 warnings=94 info=0
  command: python scripts/check_declaration_fact.py
  notes: |
    首次实现用"所有文档状态链的并集"作声明源，实测失效——改坏正典后因为
    domains/tooling/revisions/index.md 里还留着 benchmarked，并集仍包含它，
    报 0 error。改为以 revisions/WORKFLOW.md 为正典、副本与之比对后才有效。
    这条"检查本身必须先被验证能抓到错误"的经验已写进脚本 docstring。
  fresh_context: true
  fresh_context_note: |
    回归证据由脚本自动产出；两次造漂移实验是破坏性验证（改坏→看是否报错→恢复），
    不依赖作者主观判断。

