trigger_summary: |
  上一轮加 benchmarked 状态时发现：规则改了，同一概念在其他三处仍写着旧说法，
  而全仓没有任何机制能自动发现。这是治理文档特有的失败模式——文档自我漂移，
  读者（尤其 AI）读到哪一处就以哪一处为准，治理本身变成矛盾源。
  新增 scripts/check_declaration_fact.py 做四类检查（规则号/路径/脚本/状态机），
  其中状态机检查以 revisions/WORKFLOW.md 为唯一正典，副本与之比对。
