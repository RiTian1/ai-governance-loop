trigger_summary: |
  做"索引新鲜度"时先探查现状，发现 00-index.yaml 严重落后：L1 只有 4 条、
  9 个域目录完全未登记、4 条登记指向已迁移的 .md。索引是 context_loader 的唯一
  入口，未登记等于该域对 AI 不存在。新增 check_index_freshness.py 做双向比对
  （dangling / unregistered / mtime_stale），并修好了数据。
