trigger_summary: |
  J3b 四轮实测发现：recall 的 0.75/1.00 两极化 100% 由"会不会把
  FileManage_ExportError 这个公共根因单独成条"决定（命中 2/4），
  而三条更明显的 L1 四轮全中毫无区分度。说明"根因单列"是一个
  真实存在、可测量、且当前无条款覆盖的能力缺口。
  据此在 05 §8 增第 8.6 条，并设计 n=25 配对实验验证。
