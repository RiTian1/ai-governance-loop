# 闭环运行时上下文清单模板
# 规范：domains/operations/runtime-context/index.md（ops.runtime-context.r1~rN）
#
# 用途：
#   - 让 Agent 与人类协作者在最短路径内知道：「为了让某个闭环（test/deploy/run/build）跑通，需要哪些
#     环境变量 / 账号凭据 / 权限范围 / 工具版本 / 依赖包 / 网络可达性」
#   - 与 §7 沉淀范围正交：本文件描述「执行所需上下文」，不是「规则」
#
# 项目用法：
#   1. 在 project-governance.yaml 顶层加：
#        runtime_context: runtime-context.yaml
#   2. 复制本模板为 <项目根>/runtime-context.yaml 并填实
#   3. CI / pre-task hook 可校验闭环执行前必备项是否齐备

schema_version: 1

project_id: {{PROJECT_ID}}
# Auto-generated by scripts/bootstrap-windows.ps1 on {{ADOPTED_AT}}
# 项目特有 loops 请按 §"loops 示例" 增改；保留 schema 不变。

# 全局默认（所有 loop 共享，可被单 loop 覆盖）
defaults:
  secret_source: vault                 # vault | github-secrets | env | file
  required_perms: []
  os: [linux, macos, windows]

loops:
  - id: ci-test                        # 闭环标识，全项目唯一
    description: 单元测试 + 集成测试
    scope: project                     # local | project | global
    lifetime: persistent               # ephemeral | sprint | persistent
    triggers:
      commands: ["pnpm test", "pytest"]
      files: ["**/*.test.ts", "tests/**"]

    # 长任务与资源护栏（domains/operations/long-running-task）——可选
    # 重型/长耗时 loop 建议声明，供 scripts/preflight_check.py 执行前校验
    long_running: false                # 预计 > 10min 的 loop 置 true：须后台化 + 结构化进度
    preflight:
      min_disk: 5G                     # 目标路径可用空间下限（含解压/镜像 load 峰值放大）
      disk_path: .                     # 检查哪个路径的可用空间（默认项目根）
      min_mem: 2G                      # 可用内存下限
    max_parallel_ratio: 0.7            # 批量/并行任务并行度上限（占可用资源比例，默认 ≤ 70%）
    interrupt_safety: idempotent       # idempotent（幂等重入） | checkpoint（断点续跑）
    hang_timeout: 15m                  # 超过此时长无进度信号视为疑似 hang，触发告警/人工介入

    requires_env:                      # 必备环境变量
      - name: NODE_ENV
        scope: local
        default: test
      - name: DB_HOST
        scope: project
        sensitive: false

    requires_secrets:                  # 必备密钥/凭据
      - id: DB_PASSWORD
        source: vault                  # 见 defaults.secret_source
        scope: persistent              # ephemeral / sprint / persistent
        rotation: 90d
        owner: dev-team

    requires_tools:                    # 必备工具及版本
      - id: node
        version: ">=20 <21"
      - id: pnpm
        version: ">=9"

    requires_packages:                 # 必备依赖包（项目级）
      - manager: pnpm
        manifest: pnpm-lock.yaml

    requires_perms:                    # 必备权限范围
      - read:db
      - write:redis

    requires_network:                  # 必备网络可达
      - host: postgres.internal
        port: 5432
      - host: redis.internal
        port: 6379

    teardown:                          # 闭环结束后必须清理的内容
      - clear: tmp/test-artifacts/
      - revoke: ephemeral-tokens

  - id: deploy-staging
    description: 部署到 staging（离线镜像 load + docker up，典型重型长任务）
    scope: project
    lifetime: persistent
    long_running: true                 # 部署/镜像 load 常耗时 > 10min，须后台化 + 断点续跑
    preflight:
      min_disk: 60G                    # 45G 镜像 load 有解压峰值放大，留足冗余（字段实战教训）
      disk_path: /www                  # 部署根路径；权限/空间不足须在此暴露而非跑到一半
      min_mem: 8G
    interrupt_safety: checkpoint
    hang_timeout: 30m
    requires_secrets:
      - id: STAGING_DEPLOY_TOKEN
        source: github-secrets
        scope: persistent
        rotation: 180d
    requires_perms:
      - deploy:staging
    requires_tools:
      - id: docker
      - id: rsync
    requires_network:
      - host: registry.internal
        port: 5000
    teardown: []

# 多环境矩阵（domains/operations/long-running-task §8, ops.long-running-task.r6）——可选
# 声明每个部署环境的镜像/模板/密钥/监听地址/部署根，供 preflight_check --env <name> 校验，
# 并让「A 环境模板有 risk tag，B 环境没有」这类跨环境版本漂移可被检出（字段实战真实痛点）。
environments:
  - name: local
    disk_path: .
    listen: 127.0.0.1
    image_version: latest
    report_template_version: dev
  - name: staging
    disk_path: /www/myapp-deploy
    listen: 0.0.0.0
    image_version: v2.0.0
    report_template_version: risk-tagged-v2
  - name: customer
    disk_path: /home/deploy/myapp-deploy
    listen: 0.0.0.0
    image_version: v2.0.0
    report_template_version: risk-tagged-v2

# 与 housekeeping 的对接：
# - housekeeping/index.md 中 ops.housekeeping.r* 规则会扫描 teardown 列表
#   并在 CI 中强制：每个 loop 完结后必须执行 teardown，否则视为漏清理
#
# 与 long-running-task 的对接：
# - long_running: true 的 loop 执行前必须 `python scripts/preflight_check.py --loop <id>`
#   （ops.long-running-task.r2）；预检不过即阻断，不许「先跑起来再说」
